<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой формуляр — Библиотека КФУ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="header-container"></div>
    <main class="main-content">
        <div class="placeholder-page">
            <h2>📘 Мой формуляр</h2>
            <p id="name-place" >Функционал личного кабинета будет доступен позже.</p>
            <p id="email-place" >Здесь появятся: закладки, история чтения и т.д.</p>
            <div class="container retro95">
                <button class="retro95 btn" id="request">request</button>
                <input class="retro95" type="file" multiple id="pdfInput" title="choice file">
                <span hidden="hidden" id="result">some text</span>
            </div>
            <button class="btn-primary" style="margin-top: 20px;" onclick="alert('Демо-режим')">Обновить</button>
        </div>
    </main>
    <div id="footer-container"></div>
    <script src="/js/main.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
