name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/university-library:latest
          ${{ secrets.DOCKER_USERNAME }}/university-library:${{ github.sha }}
    
    - name: Deploy on server
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          cd /var/www/university
          
          # Создаем .env файл
          cat > .env << 'EOF'
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          EOF
          
          # Скачиваем новый образ
          docker pull ${{ secrets.DOCKER_USERNAME }}/university-library:latest
          
          # Обновляем docker-compose.yml для использования образа
          sed -i 's|build: .|image: ${{ secrets.DOCKER_USERNAME }}/university-library:latest|g' docker-compose.yml 2>/dev/null || true
          
          # Перезапускаем контейнеры
          docker-compose down app
          docker-compose up -d app
          
          # Очищаем старые образы
          docker image prune -f
          
          echo "✅ Деплой завершен"
