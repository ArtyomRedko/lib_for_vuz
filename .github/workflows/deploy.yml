# .github/workflows/deploy.yml
name: Deploy to Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/university-library:latest
          ${{ secrets.DOCKER_USERNAME }}/university-library:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Copy docker-compose to server
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: "docker-compose.yml,nginx.conf"
        target: "/var/www/university/"
        overwrite: true
    
    - name: Deploy on server
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          cd /var/www/university
          
          # Создаем .env файл
          cat > .env << 'EOF'
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          EOF
          
          # Создаем необходимые директории
          mkdir -p uploads uploads/PngBooks covers static ssl
          
          # Обновляем образ
          docker pull ${{ secrets.DOCKER_USERNAME }}/university-library:latest
          
          # Останавливаем только app (базу не трогаем)
          docker-compose stop app
          docker-compose rm -f app
          
          # Обновляем docker-compose.yml для использования образа
          sed -i 's|build: .|image: ${{ secrets.DOCKER_USERNAME }}/university-library:latest|g' docker-compose.yml
          
          # Запускаем всё заново
          docker-compose up -d
          
          # Ждем запуска
          sleep 10
          
          # Проверяем статус
          docker-compose ps
          docker-compose logs --tail=30 app
          
          # Очищаем старые образы
          docker image prune -f
          
          # Проверяем что приложение отвечает
          curl -f http://localhost:5000/ || echo "Health check failed"
    
    - name: Send Telegram notification
      if: always()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ${{ job.status == 'success' && '✅' || '❌' }} Деплой университетской библиотеки
          
          📦 Репозиторий: ${{ github.repository }}
          🌿 Ветка: ${{ github.ref_name }}
          🔨 Коммит: ${{ github.sha }}
          📝 Сообщение: ${{ github.event.head_commit.message }}
          👤 Автор: ${{ github.actor }}
          🕒 Время: $(TZ='Europe/Moscow' date '+%Y-%m-%d %H:%M:%S')
          
          ${{ job.status == 'success' && '🌐 https://university-library.ddns.net' || '🔍 Проверьте логи GitHub Actions' }}
