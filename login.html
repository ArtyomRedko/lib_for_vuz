<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход и регистрация — Библиотека КФУ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="header-container"></div>

    <main class="main-content">
        <h1 style="text-align: center;">Доступ в библиотеку</h1>
        <div class="auth-container">
            <div class="auth-tabs">
                <button class="tab-btn active" data-form="login">Вход</button>
                <button class="tab-btn" data-form="register">Регистрация</button>
            </div>

            <div class="auth-form active-form" id="login-form">
                <form>
                    <div class="form-group">
                        <span>Email или читательский билет</span>
                        <input type="text" id="form-login-mail" placeholder="ivanov@example.com" required>
                    </div>
                    <div class="form-group">
                        <span>Пароль</span>
                        <input type="password" id="form-login-pass" placeholder="••••••" required>
                    </div>
                    <button type="submit" class="auth-btn">Войти</button>
                </form>
            </div>

            <div class="auth-form" id="register-form">
                <form >
                    <div class="form-group">
                        <span>Полное имя</span>
                        <input type="text" id="form-register-fullName" placeholder="Иван Иванов" required>
                    </div>
                    <div class="form-group">
                        <span>Email</span>
                        <input type="email" id="form-register-mail" placeholder="ivanov@example.com" required>
                    </div>
                    <div class="form-group">
                        <span>роль</span>
                        <input type="text" id="form-register-role" placeholder="student \ teacher" required>
                    </div>
                    <div class="form-group">
                        <span>group</span>
                        <input type="text" id="form-register-group" placeholder="PI-232">
                    </div>
                    <div class="form-group">
                        <span>Пароль</span>
                        <input type="password" id="form-register-pass" placeholder="не менее 6 символов" required>
                    </div>
                    <div class="form-group">
                        <span>Подтвердите пароль</span>
                        <input type="password" id="form-register-pass2" placeholder="••••••" required>
                    </div>
                    <button type="submit" class="auth-btn">Зарегистрироваться</button>
                </form>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/initListenner.js"></script>
</body>
</html>
