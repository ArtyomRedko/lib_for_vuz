<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог — Библиотека КФУ</title>
    <link rel="stylesheet" href="/css/catalog.css">
</head>
<body>
    <div id="header-container"></div>

    <div class="search-wrapper">
        <div class="search-bar hero-search">
            <input id="searchInput" type="text" placeholder="Поиск по названию, автору...">
            <button id="searchBtn">Найти</button>
        </div>
    </div>

    <main class="main-content">
        <div class="catalog-controls" hidden="hidden">
            <div class="search-box">
                <span>Поиск по названию или автору</span>
                <input type="text" id="searchInput1" placeholder="Например: Достоевский, Война и мир...">
            </div>
            <div class="search-actions">
                <button id="searchBtn1" class="btn-search">Найти</button>
                <button id="resetSearchBtn" class="btn-clear">Сбросить</button>
            </div>
            <div class="results-info" id="resultsInfo">Все книги</div>
        </div>
        <div class="section-header">
            <a href="#" class="view-all">View All →</a>
        </div>

        <div id="catalogGrid" class="catalog-grid"><div class="book-card"></div></div>

        <div class="pagination" id="catalogPagination">
            <button id="prevPageBtn" disabled>◀ Назад</button>
            <span class="page-indicator" id="pageIndicator">Страница 1 / 1</span>
            <button id="nextPageBtn" disabled>Вперед ▶</button>
            <div class="page-jump">
                <span>Перейти к стр.</span>
                <input type="number" id="pageJumpInput" min="1" value="1">
                <button id="jumpToPageBtn">OK</button>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/catalog.js"></script>
</body>
</html>
